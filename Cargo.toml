[package]
name = "ozma"
version = "0.1.0"
edition = "2024"
description = "A terminal-based AI assistant"
license = "GPL-3.0-or-later"
repository = "https://github.com/subpop/ozma"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tui-textarea = { package = "tui-textarea-2", version = "0.11" }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
genai = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
tui-markdown = "0.3"
pulldown-cmark = "0.13"
async-trait = "0.1"
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }
rmcp = { version = "3.7", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
dirs = "6.0.0"
base64 = "0.22"
arboard = "3"
image = "0.25"
ratatui-image = { version = "11", default-features = false, features = [
    "image-defaults",
    "crossterm",
] }
agent-client-protocol = { version = "3.5", features = ["process"] }
